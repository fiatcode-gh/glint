[package]
name = "glint"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
ashpd = { version = "0.13", features = ["screencast"] }
gstreamer = { version = "0.25", features = ["v1_28"] }
oo7 = "0.6"
rtsp-types = "0.1.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
toml = "1.1.5"
tracing = "0.1.44"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
